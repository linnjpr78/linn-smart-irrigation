<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINN Smart Irrigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🌱 LINN Smart Irrigation</h1>
    <p>IoT Based Smart Irrigation Platform</p>
</header>

<div class="container">

    <div class="card">
        <h2>🌡 Temperature</h2>
        <div id="temperature">28°C</div>
    </div>

    <div class="card">
        <h2>💧 Humidity</h2>
        <div id="humidity">65%</div>
    </div>

    <div class="card">
        <h2>🌱 Soil Moisture</h2>
        <div id="moisture">42%</div>
    </div>

    <div class="card">
        <h2>🚰 Pump Status</h2>
        <div id="pump">ON</div>
    </div>

</div>

<div class="status">
    Last Updated:
    <span id="time"></span>
</div>

<footer>
    © 2026 LINN Agro | Smart Irrigation Platform
</footer>

<script src="script.js"></script>

</body>
</html>
